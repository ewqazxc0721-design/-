<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剩余 40 个动作动图审核</title><link rel="stylesheet" href="review.css">
<body><main><header><p class="eyebrow">第二批 · 40 个动作 · 尚未入库</p><h1>动作动图审核</h1><p>沿用 A2 的灰色人物与白色背景。深红表示主要肌群，浅红表示辅助肌群。静态支撑仅示意保持与呼吸；播放速度不是训练节奏。90/90 拉伸采用着装人物示意。</p><p>可逐个选择「采用」「需修改」或「不采用」。底部的批量按钮会将本批全部标为采用，并提交发布意愿；若有需要修改的动作，请先单独标记。</p></header>
<div class="toolbar"><label>查找动作<input id="search" type="search" placeholder="动作名称"></label><label>筛选肌群<select id="muscle"><option value="">所有肌群</option></select></label><label>审核状态<select id="status"><option value="">全部</option><option value="pending">待审核</option><option value="approve">采用</option><option value="revise">需修改</option><option value="reject">不采用</option></select></label><button id="stop" type="button">暂停全部</button></div>
<p id="counts" aria-live="polite">正在读取素材…</p><p id="sync" role="status">尚未提交意见</p><section id="cards" aria-label="动作候选动图"></section><footer><button id="bulk" class="primary" type="button" disabled>本批全部采用，并提交发布</button><p>该按钮保存审核意见。线上发布由后续校验与发布流程完成，不会在点击时立即改变训练数据。</p></footer></main><script src="review.js"></script></body></html>
